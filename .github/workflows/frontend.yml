name: frontend

on:
  push:
    branches: [master, main]
    paths:
      - 'Presentation/ClientApp/**'
      - '.github/workflows/frontend.yml'
  pull_request:
    paths:
      - 'Presentation/ClientApp/**'
      - '.github/workflows/frontend.yml'

defaults:
  run:
    working-directory: Presentation/ClientApp

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: Presentation/ClientApp/package-lock.json

      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run format:check
      - run: npm run build
